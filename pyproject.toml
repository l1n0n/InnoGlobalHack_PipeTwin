[project]
name = "innoglobalhack-pipetwin"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "fastapi>=0.163.1",
    "matplotlib>=3.11.2",
    "neqsim>=3.29.0,<4",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "python-calamine>=0.9.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
legacy = [
    "altair>=6.3.0",
    "pywebview>=6.2.1 ; sys_platform == 'win32'",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
